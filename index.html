<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adeeb Chatbot</title>
  <meta name="description" content="Frontend-only Adeeb Chatbot connected with Google Sheet Sheet1 CSV." />
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #FFFFFF;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 142, 1, 0.14), transparent 34%),
        radial-gradient(circle at 88% 20%, rgba(255, 255, 255, 0.06), transparent 34%),
        linear-gradient(135deg, #111820 0%, #222D38 52%, #111820 100%);
    }
    body::-webkit-scrollbar { width: 10px; }
    body::-webkit-scrollbar-track { background: #111820; }
    body::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #FF8E01, #d87300);
      border-radius: 999px;
      border: 2px solid #111820;
    }
    .page-shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 84px 0 90px;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 28px;
      align-items: center;
      min-height: 520px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #FF8E01;
      background: rgba(255, 142, 1, .10);
      border: 1px solid rgba(255, 142, 1, .32);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 18px;
      color: #ffffff;
      font-size: clamp(42px, 6vw, 74px);
      line-height: .96;
      letter-spacing: -0.055em;
      text-shadow: 0 24px 60px rgba(0,0,0,.40);
    }
    .hero p {
      margin: 0;
      max-width: 650px;
      color: rgba(255,255,255,.74);
      font-size: 19px;
      line-height: 1.75;
    }
    .note {
      margin-top: 28px;
      padding: 18px 20px;
      border-radius: 22px;
      color: #FFFFFF;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 142, 1, .32);
      box-shadow: 0 22px 70px rgba(0,0,0,.24);
      backdrop-filter: blur(12px);
    }
    code { color: #FF8E01; font-weight: 900; }
    .preview-card {
      border-radius: 32px;
      min-height: 390px;
      padding: 26px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035)),
        rgba(34, 45, 56, .78);
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 34px 110px rgba(0,0,0,.34);
      backdrop-filter: blur(16px);
    }
    .preview-card h2 {
      margin: 0 0 14px;
      font-size: 26px;
      color: #ffffff;
    }
    .preview-card p {
      font-size: 16px;
      color: rgba(255,255,255,.72);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 36px;
    }
    section.tile {
      min-height: 150px;
      padding: 22px;
      border-radius: 26px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 24px 80px rgba(0,0,0,.20);
    }
    .tile h2 { margin: 0 0 12px; font-size: 23px; color: #ffffff; }
    .tile p { margin: 0; line-height: 1.6; color: rgba(255,255,255,.72); }
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; min-height: auto; }
      .preview-card { min-height: 260px; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <div class="hero" id="home">
      <div>
        <div class="eyebrow">Adeeb Technology Lab</div>
        <h1>Adeeb Chatbot</h1>
      </div>
      </div>
    </div>
  </main>

  <script>
    window.ADEEB_CHATBOT_NAME = "Adeeb Chatbot";
    window.ADEEB_CHATBOT_CONFIG_URL = "./config.json";
  </script>
  <script src="./chatbot-widget.js"></script>
</body>
</html>
